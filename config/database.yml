# PostgreSQL. In development and test the connection settings come from the
# environment so the database can run in docker compose (see docker-compose.yml)
# or anywhere else. Production reads DATABASE_URL.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5442) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "recipes") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "recipes") %>

development:
  <<: *default
  database: recipes_development

test:
  <<: *default
  database: recipes_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: recipes_production
