name: recipes

# `docker compose up --build` runs the app on http://localhost:4402 with a demo
# account (demo@example.com / demo-password). For local development without the
# app container, start only the database: `docker compose up -d db`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes}
      POSTGRES_DB: ${POSTGRES_DB:-recipes}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-recipes}:${POSTGRES_PASSWORD:-recipes}@db:5432/${POSTGRES_DB:-recipes}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-development-secret-change-me-0123456789abcdef0123456789abcdef}
      APP_HOST: ${APP_HOST:-localhost}
      APP_PORT: ${APP_PORT:-4402}
      FORCE_SSL: ${FORCE_SSL:-false}
      TIME_ZONE: ${TIME_ZONE:-UTC}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      # Creates demo@example.com / demo-password with sample recipes and a planned week.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-4402}:3000"
    volumes:
      - storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped

volumes:
  db-data:
  storage:
